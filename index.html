<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="탑승">
<title>탑승</title>
<style>
  :root { --bg:#fff; --fg:#111; --sub:#666; --card:#f3f4f6; --suin:#d97706; --exp:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0c; --fg:#f2f2f2; --sub:#9a9a9a; --card:#1c1c1f; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
         padding:calc(env(safe-area-inset-top) + 24px) 20px 32px; }
  .time { font-size:15px; color:var(--sub); }
  .route { font-size:44px; font-weight:800; margin:6px 0 20px; line-height:1.1; }
  .route.suin { color:var(--suin); } .route.exp { color:var(--exp); }
  .card { background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:10px; font-size:17px; line-height:1.45; }
  .card b { display:block; font-size:13px; color:var(--sub); font-weight:600; margin-bottom:2px; }
  .win { outline:2px solid currentColor; }
  button { margin-top:14px; width:100%; padding:14px; font-size:17px; border:0; border-radius:12px;
           background:var(--fg); color:var(--bg); font-weight:700; }
</style>
</head>
<body>
  <div class="time" id="time">불러오는 중…</div>
  <div class="route" id="route"></div>
  <div class="card" id="a"></div>
  <div class="card" id="b"></div>
  <button onclick="run()">다시 조회</button>
<script>
function pad(n){ return String(n).padStart(2,"0"); }
async function run(){
  const q = new URLSearchParams(location.search).get("t");        // 테스트용 ?t=07:41
  const now = new Date();
  const key = q || pad(now.getHours()) + ":" + pad(now.getMinutes());
  const day = now.getDay();                                          // 0=일, 6=토
  const file = day === 6 ? "lookup_sat.json" : day === 0 ? "lookup_hol.json" : "lookup.json";
  const dayLabel = day === 6 ? "토요일" : day === 0 ? "일요일" : "평일";
  document.getElementById("time").textContent = `${key} 경인교대입구 탑승 · ${dayLabel}`;
  try {
    const r = await fetch(file + "?v=" + Date.now(), { cache: "no-store" });
    const d = await r.json();
    const v = d[key] || "결과 없음";
    const parts = v.split(" | ");
    const head = parts[0] || v;
    const isSuin = head.includes("🟢");
    const el = document.getElementById("route");
    el.textContent = head.replace(/^[^\s]+\s/, "");
    el.className = "route " + (isSuin ? "suin" : head.includes("🔵") ? "exp" : "");
    document.getElementById("a").innerHTML = `<b>추천</b>${parts[1] || ""}`;
    document.getElementById("b").innerHTML = `<b>다른 경로</b>${parts[2] || ""}`;
  } catch(e) {
    document.getElementById("route").textContent = "불러오기 실패";
  }
}
run();
document.addEventListener("visibilitychange", () => { if (!document.hidden) run(); });
</script>
</body>
</html>
